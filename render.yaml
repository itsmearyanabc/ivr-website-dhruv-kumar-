services:
  - type: web
    name: xpack-ivr-portal
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0

      # Supabase. Set the values in the Render dashboard; sync:false keeps them out of the
      # repository and stops a blueprint apply from clearing them.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # The only credentials accepted at /admin. Without these the admin sign-in fails with
      # "System configuration error".
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Optional: salt for hashing top-up submitter IPs. Falls back to the service role key.
      - key: IP_HASH_SALT
        sync: false

# NOTE: this service stores everything in Supabase, not in a Render database. The
# xpack-postgres instance below is left declared only so that applying this blueprint does
# not delete an existing one - nothing in the application reads DATABASE_URL. If you are not
# using it, delete it from the Render dashboard and remove this block.
databases:
  - name: xpack-postgres
    plan: basic-256mb
    databaseName: xpack
    user: xpack_admin
